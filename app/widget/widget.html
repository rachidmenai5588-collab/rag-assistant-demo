<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد المتجر — Saffron &amp; Sage</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; margin: 0; }
  #chat { max-width: 560px; margin: 0 auto; padding: 16px; }
  .msg { padding: 10px 14px; border-radius: 12px; margin: 8px 0; line-height: 1.7; }
  .user { background: #f0e6d2; text-align: right; }
  .bot { background: #faf7f0; border: 1px solid #e5dcc8; }
  .refused { background: #fdf3e7; border: 1px dashed #d9a441; }
  .sources { font-size: 0.85em; color: #6b5d3f; margin-top: 6px; }
  #q { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1em; }
  button { padding: 10px 18px; margin-top: 8px; cursor: pointer; }
  .waking { color: #8a6d1b; }
</style>
</head>
<body>
<div id="chat">
  <h1>مساعد Saffron &amp; Sage</h1>
  <p>اسأل عن سياسات المتجر — الإرجاع، التوصيل، ساعات العمل، الضمان، الدفع.</p>
  <div id="log"></div>
  <input id="q" type="text" maxlength="1000" placeholder="اكتب سؤالك هنا…">
  <button id="send">إرسال</button>
  <p id="status"></p>
</div>
<script src="/widget.js"></script>
</body>
</html>
